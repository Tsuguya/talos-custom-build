name: Check Talos Release

on:
  schedule:
    - cron: "0 9 * * 1" # Mon 18:00 JST
  workflow_dispatch: {}

# ジョブ側で最小限だけ宣言する。check ジョブは読むだけで、
# write が要るのは build.yml 側のリリース作成と GHCR push だけ。
permissions: {}

# 週次の schedule と手動 dispatch が重なっても、同じ版を二重にビルドしない。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # gh release view で自リポのリリース有無を見るだけ
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check for new Talos release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LATEST=$(curl -sf https://api.github.com/repos/siderolabs/talos/releases/latest | jq -r .tag_name)

          # この値は build.yml に渡り、最終的に image tag と git ref になる。
          # 上流が何を書いても良い文字列なので、渡す前にここで形を縛る。
          if [[ ! "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected Talos release tag: ${LATEST}"
            exit 1
          fi

          echo "Latest Talos release: $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

          if gh release view "$LATEST" --repo "$REPO" > /dev/null 2>&1; then
            echo "Already built $LATEST — skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release $LATEST — triggering build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    # zizmor 1.30 の self-repository は `./` を `$/` にしろと言う。従わないのは、
    # `$/` にすると actionlint が呼び出しを解決できなくなり、reusable workflow の
    # input 検証（必須の欠落・存在しない input 名）がまるごと消えるから（実測）。
    # audit の根拠である「前段ステップが clone したものを掴む」も、job レベルの
    # 呼び出しには当たらない — GitHub が同じ commit から解決し FS を見ない。
    # ignore は行単位。ステップの `uses: ./my-action` は今も検出される。
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      talos_version: ${{ needs.check.outputs.version }}
    # secrets: inherit を外してある。build.yml が使うのは GITHUB_TOKEN だけで、
    # それは呼び出し先に自動で渡る。inherit はこのリポの全 secret を渡す。
    permissions:
      contents: write # 呼び先がプレリリースを作る
      packages: write # 呼び先が GHCR へ push する

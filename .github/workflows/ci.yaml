name: CI

# このリポジトリには長らく pull_request で走る検査が無く、zizmor の指摘が
# 51 件（うち high 14）溜まっていた。共有ワークフローを呼んで、
# ワークフロー自身と Renovate 設定の両方を毎 PR で見る。
on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # ワークフローの lint は 6 リポジトリ共通なので home-actions に寄せてある。
  # ツールのピンは向こう側にあり、ここは呼び先の SHA を追うだけ。
  lint-workflows:
    uses: Tsuguya/home-actions/.github/workflows/lint-workflows.yml@10834ead7a2c2ca71677a6b818cd066d329eacbb # v1.2.0
    permissions:
      contents: read

  # Renovate 設定の検証。Renovate は知らないキーを黙って捨てるので（PR も警告も
  # 出ない）、バリデータだけがこの層の間違いを検出できる。
  lint-renovate:
    uses: Tsuguya/home-actions/.github/workflows/lint-renovate.yml@10834ead7a2c2ca71677a6b818cd066d329eacbb # v1.2.0
    permissions:
      contents: read

  # 必須チェックにするならこれ 1 個だけを登録する。個別ジョブ名を必須化すると、
  # 名前を変えた瞬間に全 PR が "Waiting for status to be reported" で詰まる。
  gate:
    name: CI Gate
    needs: [lint-workflows, lint-renovate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          # fail-closed: needs が空だとループが素通りして緑になる
          if [ -z "${RESULTS// /}" ]; then
            echo "::error::No job results to aggregate (empty needs) — failing closed."
            exit 1
          fi
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::A required job concluded with: ${r}"; exit 1 ;;
            esac
          done
